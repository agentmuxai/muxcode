version: 2
updates:
  # Patch updates arrive as one grouped PR a week. A minor update gets a PR of its own, so one
  # that needs a closer look (a 0.x minor can break) doesn't hold back the rest. Major versions
  # need code changes and are taken deliberately (#47), so Dependabot doesn't
  # open PRs for them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Don't propose a version younger than a week: a compromised release is usually found and
    # pulled in the first days. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      npm-patch:
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
