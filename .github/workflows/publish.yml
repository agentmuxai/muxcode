name: Publish to npm

# Publishes @agentmuxai/muxcode to the public npm registry when a version tag
# (v0.2.0, ...) is pushed. The tag must match package.json's version.
#
# Needs a repository secret NPM_TOKEN: an npm automation (or granular publish)
# token for the "agentmuxai" npm org. AgentMux installs the package with
# `npm install -g @agentmuxai/muxcode@<pinned version>`, so every version it
# pins must be published here first.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Smoke test the CLI
        run: node bin/muxcode.js --version
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
