name: Publish to npm

# Publishes @agentmuxai/muxcode to the public npm registry when a version tag
# (v0.2.0, ...) is pushed. The tag must match package.json's version.
#
# Publishes through npm trusted publishing: the job's GitHub OIDC identity,
# which npmjs.com accepts for this repo and this workflow file, so no npm token
# is stored anywhere. Provenance is attached automatically. Needs npm 11.5.1+.
# (A brand-new package can't be first-published this way, so the name was
# reserved with a hand-published, code-free 0.0.0.) AgentMux installs the package with
# `npm install -g @agentmuxai/muxcode@<pinned version>`, so every version it
# pins must be published here first.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Smoke test the CLI
        run: node bin/muxcode.js --version
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm publish --access public
