name: CI

on:
  pull_request:
  push:
    branches: [main, agent3/initial-implementation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test the CLI
        run: node bin/muxcode.js --version
      - name: Check what would be published
        run: npm pack --dry-run
