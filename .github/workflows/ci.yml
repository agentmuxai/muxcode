name: CI

on:
  pull_request:
  push:
    branches: [main, agent3/initial-implementation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke test the CLI
        run: node bin/muxcode.js --version
      - name: Check what would be published
        run: npm pack --dry-run

  # The one check branch protection requires (as on agentmuxai/agentmux), so
  # adding or renaming jobs above never needs a settings change.
  ci-required:
    name: CI required
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build finished with '${{ needs.build.result }}'"
            exit 1
          fi
